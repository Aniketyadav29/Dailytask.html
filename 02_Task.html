# Html code to create a 3D room :-

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 3D Room</title>
<style>
  /* Center the room on the screen and add a dark background */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #1a1a1a;
    margin: 0;
    /* This gives the 3D depth effect */
    perspective: 1200px; 
  }

  /* The main room container */
  .room {
    position: relative;
    width: 300px;
    height: 300px;
    /* Allows child elements to exist in 3D space */
    transform-style: preserve-3d; 
    /* Rotate the whole room to get an isometric angle */
    transform: rotateX(-20deg) rotateY(45deg);
    transition: transform 0.5s ease;
  }

  /* Hover effect to spin the room slightly */
  .room:hover {
    transform: rotateX(-20deg) rotateY(15deg);
  }

  /* Base styling for all walls and floor */
  .surface {
    position: absolute;
    width: 300px;
    height: 300px;
    /* Adds a subtle shadow to the corners */
    box-shadow: inset 0 0 60px rgba(0,0,0,0.3);
  }

  /* The Floor */
  .floor {
    transform: rotateX(90deg) translateZ(-150px);
    /* Create a checkered tile pattern using gradients */
    background-color: #ecf0f1;
    background-image: 
      linear-gradient(45deg, #bdc3c7 25%, transparent 25%, transparent 75%, #bdc3c7 75%, #bdc3c7), 
      linear-gradient(45deg, #bdc3c7 25%, transparent 25%, transparent 75%, #bdc3c7 75%, #bdc3c7);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
  }

  /* Left Wall */
  .wall-left {
    background: #3498db; /* Blue wall */
    transform: rotateY(90deg) translateZ(-150px);
  }

  /* Right Wall */
  .wall-right {
    background: #2980b9; /* Slightly darker blue for depth */
    transform: translateZ(-150px);
  }

  /* A simple window on the right wall */
  .window {
    position: absolute;
    top: 60px;
    left: 80px;
    width: 100px;
    height: 120px;
    background: #87ceeb; /* Sky blue */
    border: 8px solid #ffffff;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 10px 10px 20px rgba(0,0,0,0.3);
  }

  /* A decorative rug on the floor */
  .rug {
    position: absolute;
    bottom: 50px;
    left: 50px;
    width: 180px;
    height: 120px;
    background: #e74c3c; /* Red rug */
    border-radius: 10px;
    /* Positioned slightly above the floor on the Z-axis */
    transform: rotateX(90deg) translateZ(-148px);
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <!-- The 3D Room Structure -->
  <div class="room">
    <div class="surface floor"></div>
    <div class="surface wall-left"></div>
    
    <div class="surface wall-right">
      <div class="window"></div>
    </div>
    
    <div class="rug"></div>
  </div>

</body>
</html>
