<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professional Wallpaper Slider</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      overflow:hidden;
      background:#000;
      height:100vh;
    }

    /* Background Slides */
    .slider{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
    }

    .slide{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      opacity:0;
      transform:scale(1.08);
      transition:
        opacity 1.5s ease,
        transform 7s ease;
    }

    .slide.active{
      opacity:1;
      transform:scale(1);
      z-index:1;
    }

    /* Dark cinematic overlay */
    .overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.35),
          rgba(0,0,0,0.55)
        );
      z-index:2;
    }

    /* Main Content */
    .content{
      position:relative;
      z-index:3;
      width:100%;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
    }

    .badge{
      padding:10px 18px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      border-radius:50px;
      font-size:14px;
      letter-spacing:1px;
      margin-bottom:25px;
      animation:fadeIn 1.2s ease;
    }

    h1{
      font-size:72px;
      font-weight:700;
      line-height:1.1;
      letter-spacing:-2px;
      max-width:900px;
      animation:fadeUp 1s ease;
    }

    p{
      margin-top:22px;
      font-size:20px;
      font-weight:300;
      max-width:700px;
      color:rgba(255,255,255,0.82);
      line-height:1.8;
      animation:fadeUp 1.4s ease;
    }

    /* Controls */
    .controls{
      position:absolute;
      bottom:40px;
      left:50%;
      transform:translateX(-50%);
      z-index:5;

      display:flex;
      align-items:center;
      gap:18px;

      padding:14px 22px;

      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(18px);

      border:1px solid rgba(255,255,255,0.12);
      border-radius:18px;
    }

    .btn{
      width:52px;
      height:52px;
      border:none;
      border-radius:14px;

      background:rgba(255,255,255,0.08);
      color:white;

      font-size:18px;
      cursor:pointer;

      transition:0.3s ease;
    }

    .btn:hover{
      background:white;
      color:black;
      transform:translateY(-2px);
    }

    /* Indicators */
    .indicators{
      display:flex;
      gap:10px;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:rgba(255,255,255,0.35);
      transition:0.3s ease;
    }

    .dot.active{
      width:34px;
      border-radius:20px;
      background:white;
    }

    /* Top Right Info */
    .info{
      position:absolute;
      top:30px;
      right:35px;
      z-index:5;

      padding:12px 18px;

      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);

      backdrop-filter:blur(15px);

      color:white;
      border-radius:16px;
      font-size:14px;
      letter-spacing:0.5px;
    }

    /* Animations */
    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
      }
      to{
        opacity:1;
      }
    }

    /* Mobile Responsive */
    @media(max-width:768px){

      h1{
        font-size:42px;
      }

      p{
        font-size:16px;
      }

      .controls{
        bottom:25px;
        padding:12px 16px;
      }

      .btn{
        width:46px;
        height:46px;
      }

      .info{
        top:18px;
        right:18px;
      }
    }

  </style>
</head>

<body>

  <!-- Background Slider -->
  <div class="slider">

    <div class="slide active"
      style="background-image:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920');">
    </div>

    <div class="slide"
      style="background-image:url('https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1920');">
    </div>

    <div class="slide"
      style="background-image:url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1920');">
    </div>

    <div class="slide"
      style="background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1920');">
    </div>

  </div>

  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Info -->
  <div class="info">
    Auto Changing Wallpaper
  </div>

  <!-- Main Content -->
  <div class="content">

    <div class="badge">
      PREMIUM EXPERIENCE
    </div>

    <h1>
      Dynamic Professional Wallpaper Slider
    </h1>

    <p>
      Elegant fullscreen wallpaper transitions with cinematic animations,
      glassmorphism controls, and responsive modern UI.
    </p>

  </div>

  <!-- Controls -->
  <div class="controls">

    <button class="btn" onclick="prevSlide()">❮</button>

    <div class="indicators" id="indicators"></div>

    <button class="btn" onclick="nextSlide()">❯</button>

  </div>

  <script>

    const slides = document.querySelectorAll('.slide');
    const indicators = document.getElementById('indicators');

    let current = 0;

    // Create indicators
    slides.forEach((_, index) => {

      const dot = document.createElement('div');
      dot.classList.add('dot');

      if(index === 0){
        dot.classList.add('active');
      }

      indicators.appendChild(dot);
    });

    const dots = document.querySelectorAll('.dot');

    // Show slide
    function showSlide(index){

      slides.forEach(slide => {
        slide.classList.remove('active');
      });

      dots.forEach(dot => {
        dot.classList.remove('active');
      });

      slides[index].classList.add('active');
      dots[index].classList.add('active');
    }

    // Next Slide
    function nextSlide(){

      current++;

      if(current >= slides.length){
        current = 0;
      }

      showSlide(current);
    }

    // Previous Slide
    function prevSlide(){

      current--;

      if(current < 0){
        current = slides.length - 1;
      }

      showSlide(current);
    }

    // Auto Change Every 5 Seconds
    setInterval(nextSlide, 5000);

  </script>

</body>
</html>
