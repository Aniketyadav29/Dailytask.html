<!DOCTYPE html>
<html>
<head>
    <title>Gravity Dodge</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            margin: auto;
            background: #222;
            border: 2px solid white;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div id="score">Score: 0</div>
<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

let score = 0;
let gameOver = false;

const player = {
    x: 100,
    y: 350,
    radius: 15,
    gravity: 1,
    velocity: 0
};

const obstacles = [];

function createObstacle() {
    const gapY = Math.random() * 200 + 50;

    obstacles.push({
        x: canvas.width,
        width: 40,
        topHeight: gapY,
        bottomY: gapY + 120
    });
}

setInterval(() => {
    if (!gameOver) createObstacle();
}, 1500);

document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
        player.gravity *= -1;
    }

    if (gameOver && e.code === "Enter") {
        location.reload();
    }
});

function update() {
    if (gameOver) return;

    player.velocity += 0.5 * player.gravity;
    player.y += player.velocity;

    if (player.y > canvas.height - player.radius) {
        player.y = canvas.height - player.radius;
        player.velocity = 0;
    }

    if (player.y < player.radius) {
        player.y = player.radius;
        player.velocity = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let ob = obstacles[i];
        ob.x -= 5;

        if (
            player.x + player.radius > ob.x &&
            player.x - player.radius < ob.x + ob.width
        ) {
            if (
                player.y - player.radius < ob.topHeight ||
                player.y + player.radius > ob.bottomY
            ) {
                gameOver = true;
            }
        }

        if (ob.x + ob.width < 0) {
            obstacles.splice(i, 1);
            score++;
            scoreText.innerText = "Score: " + score;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "deepskyblue";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "red";
    obstacles.forEach(ob => {
        ctx.fillRect(ob.x, 0, ob.width, ob.topHeight);
        ctx.fillRect(
            ob.x,
            ob.bottomY,
            ob.width,
            canvas.height - ob.bottomY
        );
    });

    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 270, 180);

        ctx.font = "22px Arial";
        ctx.fillText(
            "Press ENTER to Restart",
            260,
            230
        );
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
