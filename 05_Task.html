
<!-- Gravity Runner Pro -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Runner Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:
    radial-gradient(circle at center,#222,#000);
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    z-index:10;
    font-size:22px;
    text-shadow:0 0 10px cyan;
}

#help{
    position:absolute;
    top:15px;
    right:15px;
    color:#ddd;
    font-size:16px;
    text-align:right;
}
</style>
</head>

<body>

<div id="ui">
    Score: <span id="score">0</span><br>
    High Score: <span id="high">0</span>
</div>

<div id="help">
    SPACE / TAP = Flip Gravity<br>
    P = Pause<br>
    ENTER = Restart
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const scoreEl = document.getElementById("score");
const highEl = document.getElementById("high");

let score=0;
let highScore=localStorage.getItem("gravityHigh") || 0;
highEl.textContent=highScore;

let gameOver=false;
let paused=false;

const player={
    x:150,
    y:200,
    r:18,
    vy:0,
    gravity:1
};

let particles=[];
let obstacles=[];
let obstacleTimer=0;
let gameSpeed=350;

function createObstacle(){
    let gap=180;
    let top=Math.random()*(canvas.height-gap-150)+50;

    obstacles.push({
        x:canvas.width+100,
        width:60,
        topHeight:top,
        bottomY:top+gap,
        scored:false
    });
}

function createParticles(x,y){
    for(let i=0;i<15;i++){
        particles.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8,
            life:40
        });
    }
}

function flipGravity(){
    if(gameOver) return;
    player.gravity*=-1;
    player.vy*=0.8;
    createParticles(player.x,player.y);
}

document.addEventListener("keydown",(e)=>{

    if(e.code==="Space"){
        flipGravity();
    }

    if(e.key==="p" || e.key==="P"){
        paused=!paused;
    }

    if(gameOver && e.key==="Enter"){
        location.reload();
    }
});

document.addEventListener("touchstart",()=>{
    flipGravity();
});

let lastTime=0;

function update(delta){

    if(gameOver || paused) return;

    gameSpeed=350+(score*12);

    player.vy+=1500*player.gravity*delta;
    player.y+=player.vy*delta;

    if(player.y-player.r<0){
        player.y=player.r;
        player.vy=0;
    }

    if(player.y+player.r>canvas.height){
        player.y=canvas.height-player.r;
        player.vy=0;
    }

    obstacleTimer+=delta;

    if(obstacleTimer>1.5){
        obstacleTimer=0;
        createObstacle();
    }

    for(let i=obstacles.length-1;i>=0;i--){

        let o=obstacles[i];

        o.x-=gameSpeed*delta;

        if(!o.scored && o.x+o.width<player.x){
            score++;
            scoreEl.textContent=score;

            if(score>highScore){
                highScore=score;
                highEl.textContent=highScore;
                localStorage.setItem("gravityHigh",highScore);
            }

            o.scored=true;
        }

        if(
           player.x+player.r>o.x &&
           player.x-player.r<o.x+o.width
        ){

            if(
                player.y-player.r<o.topHeight ||
                player.y+player.r>o.bottomY
            ){
                gameOver=true;
            }
        }

        if(o.x+o.width<0){
            obstacles.splice(i,1);
        }
    }

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }
}

function drawBackground(){

    let grad=ctx.createLinearGradient(
        0,0,canvas.width,canvas.height
    );

    grad.addColorStop(0,"#050510");
    grad.addColorStop(1,"#000");

    ctx.fillStyle=grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<100;i++){
        ctx.fillStyle="rgba(255,255,255,0.2)";
        ctx.fillRect(
            (i*137)%canvas.width,
            (i*79)%canvas.height,
            2,2
        );
    }
}

function draw(){

    drawBackground();

    obstacles.forEach(o=>{

        ctx.shadowBlur=20;
        ctx.shadowColor="red";

        ctx.fillStyle="#ff2e63";

        ctx.fillRect(
            o.x,
            0,
            o.width,
            o.topHeight
        );

        ctx.fillRect(
            o.x,
            o.bottomY,
            o.width,
            canvas.height-o.bottomY
        );
    });

    particles.forEach(p=>{

        ctx.shadowBlur=10;
        ctx.shadowColor="cyan";

        ctx.fillStyle=
        "rgba(0,255,255,"+(p.life/40)+")";

        ctx.beginPath();
        ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fill();
    });

    ctx.shadowBlur=30;
    ctx.shadowColor="cyan";

    ctx.fillStyle="deepskyblue";

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.r,
        0,
        Math.PI*2
    );
    ctx.fill();

    if(paused){

        ctx.fillStyle="white";
        ctx.font="60px Arial";
        ctx.fillText(
            "PAUSED",
            canvas.width/2-120,
            canvas.height/2
        );
    }

    if(gameOver){

        ctx.fillStyle="white";
        ctx.font="70px Arial";
        ctx.fillText(
            "GAME OVER",
            canvas.width/2-220,
            canvas.height/2-20
        );

        ctx.font="30px Arial";
        ctx.fillText(
            "Press ENTER to Restart",
            canvas.width/2-170,
            canvas.height/2+50
        );
    }
}

function gameLoop(time){

    let delta=(time-lastTime)/1000;
    lastTime=time;

    update(delta);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
</body>
</html>
