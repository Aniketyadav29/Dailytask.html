<!-- Simple Guess the Number Game
The game will:
               Generate a random number between 1 and 100.
               Allow the user to input a guess.
               Provide feedback if the guess is too high, too low, or correct.
               Track the number of guesses. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number Game</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        h1 {
            color: #333;
        }

        .game-area {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        #guessInput {
            padding: 10px;
            width: 80px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            font-weight: bold;
            margin: 15px 0;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Guess The Number!</h1>
        <p>I'm thinking of a number between 1 and 10.</p>
        
        <div class="game-area">
            <label for="guessInput">Enter your guess:</label>
            <div class="input-group">
                <input type="number" id="guessInput" min="1" max="100">
                <button id="submitButton" onclick="checkGuess()">Submit Guess</button>
            </div>
        </div>

        <p id="message">Guess a number between 1 and 10.</p>
        <p>Guesses remaining: <span id="guessesRemaining">10</span></p>
        <button id="newGameButton" style="display:none;" onclick="newGame()">Start New Game</button>
    </div>

    <script>
        let secretNumber;
        let guessesLeft;
        const maxGuesses = 10;

        const guessInput = document.getElementById('guessInput');
        const message = document.getElementById('message');
        const guessesRemainingSpan = document.getElementById('guessesRemaining');
        const newGameButton = document.getElementById('newGameButton');
        const submitButton = document.getElementById('submitButton');

        function newGame() {
            secretNumber = Math.floor(Math.random() * 10) + 1;
            guessesLeft = maxGuesses;

            message.textContent = 'Guess a number between 1 and 10.';
            message.style.color = '#333';
            guessesRemainingSpan.textContent = guessesLeft;
            guessInput.value = '';
            guessInput.disabled = false;
            submitButton.disabled = false;
            newGameButton.style.display = 'none';

            guessInput.focus(); 
        }

        function checkGuess() {
            const guess = parseInt(guessInput.value);

            if (isNaN(guess) || guess < 1 || guess > 10) {
                message.textContent = 'Please enter a valid number between 1 and 10.';
                message.style.color = 'orange';
                return;
            }

            guessesLeft--;
            guessesRemainingSpan.textContent = guessesLeft;

            if (guess === secretNumber) {
                message.textContent = `🎉 Congratulations! You guessed the number ${secretNumber} in ${maxGuesses - guessesLeft} attempts!`;
                message.style.color = 'green';
                endGame();
            } else if (guessesLeft === 0) {
                message.textContent = `❌ Game Over! The number was ${secretNumber}.`;
                message.style.color = 'red';
                endGame();
            } else if (guess < secretNumber) {
                message.textContent = 'Too Low! Try again.';
                message.style.color = 'blue';
            } else {
                message.textContent = 'Too High! Try again.';
                message.style.color = 'blue';
            }

            guessInput.value = '';
            if (guessesLeft > 0) {
                guessInput.focus();
            }
        }

        function endGame() {
            guessInput.disabled = true;
            submitButton.disabled = true;
            newGameButton.style.display = 'block';
        }

        newGame();
    </script>
</body>
</html>
