<!-- Neon Orb Catcher - Enhanced -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Orb Catcher - Enhanced</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 500px;
            background: #161620;
            border: 2px solid #2a2a3d;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0,255,204,0.05);
            overflow: hidden;
        }

        /* Timer Bar */
        #timer-bar-container {
            width: 100%;
            height: 6px;
            background: #333;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background: #00ffcc;
            transition: width 1s linear, background-color 0.5s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #1c1c28;
            border-bottom: 2px solid #2a2a3d;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #score { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }

        #orb {
            position: absolute;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #fff, #00ffcc);
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
            cursor: crosshair;
            transition: left 0.1s ease-out, top 0.1s ease-out, width 0.2s, height 0.2s;
            transform: translate(-50%, -50%); /* Centers the orb on its coordinates */
        }

        #orb:active { filter: brightness(1.5); }

        /* Particle Effects */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #00ffcc;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px #00ffcc;
            animation: explode 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes explode {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        .btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #ff007f;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transition: transform 0.1s, box-shadow 0.2s;
            z-index: 10;
        }

        .btn:hover { box-shadow: 0 0 30px rgba(255, 0, 127, 0.9); }
        .btn:active { transform: translate(-50%, -50%) scale(0.95); }

        /* Screen Shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake-active { animation: shake 0.2s; }
    </style>
</head>
<body>

    <h1 style="color: #fff; letter-spacing: 2px;">NEON <span style="color:#00ffcc; text-shadow: 0 0 15px #00ffcc;">ORB</span> CATCHER</h1>

    <div id="game-container">
        <div id="timer-bar-container">
            <div id="timer-bar"></div>
        </div>
        <div class="header">
            <span>Score: <span id="score">0</span></span>
        </div>
        
        <button class="btn" id="start-btn">PLAY</button>
        <div id="orb" style="display: none;"></div>
    </div>

    <script>
        const orb = document.getElementById('orb');
        const scoreDisplay = document.getElementById('score');
        const startBtn = document.getElementById('start-btn');
        const container = document.getElementById('game-container');
        const timerBar = document.getElementById('timer-bar');

        let score = 0;
        let timeLeft = 30;
        let totalTime = 30;
        let gameInterval;
        let timerInterval;
        
        // --- Audio System (Synthesizer) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // --- Particle System ---
        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40 + 20;
                p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                container.appendChild(p);
                setTimeout(() => p.remove(), 400); // Clean up DOM
            }
        }

        // --- Game Logic ---
        function startGame() {
            score = 0;
            timeLeft = totalTime;
            scoreDisplay.textContent = score;
            
            // Reset UI
            startBtn.style.display = 'none';
            orb.style.display = 'block';
            orb.style.width = '45px';
            orb.style.height = '45px';
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = '#00ffcc';

            moveOrb();
            
            // Smooth Timer Bar Countdown
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                const percentage = (timeLeft / totalTime) * 100;
                timerBar.style.width = `${percentage}%`;
                
                // Change color to red when time is low
                if (timeLeft < 10) timerBar.style.backgroundColor = '#ff007f';

                if (timeLeft <= 0) endGame();
            }, 100);

            gameInterval = setInterval(moveOrb, 1200);
        }

        function moveOrb() {
            // Container bounds minus the header/timer (approx 70px) and padding
            const padding = 30; 
            const maxX = container.clientWidth - padding;
            const maxY = container.clientHeight - 70 - padding; 

            const randomX = Math.floor(Math.random() * (maxX - padding) + padding);
            const randomY = Math.floor(Math.random() * (maxY - padding) + 70 + padding); 

            orb.style.left = `${randomX}px`;
            orb.style.top = `${randomY}px`;
        }

        orb.addEventListener('mousedown', (e) => {
            playSound('pop');
            
            // Get coordinates relative to the container for particles
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createParticles(x, y);

            score++;
            scoreDisplay.textContent = score;
            
            clearInterval(gameInterval); 
            moveOrb();
            
            // Difficulty curve: Speed increases, Size decreases
            const newSpeed = Math.max(400, 1200 - (score * 25));
            const newSize = Math.max(20, 45 - (score * 0.5));
            
            orb.style.width = `${newSize}px`;
            orb.style.height = `${newSize}px`;

            gameInterval = setInterval(moveOrb, newSpeed);
        });

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(timerInterval);
            playSound('gameover');
            
            // Screen shake effect
            container.classList.add('shake-active');
            setTimeout(() => container.classList.remove('shake-active'), 200);

            orb.style.display = 'none';
            startBtn.style.display = 'block';
            startBtn.textContent = `SCORE: ${score} - PLAY AGAIN`;
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
